<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>dsh-queue-plus demo</title>
  <style>
    :root {
      --dsw-alias-label-primary: #1b1b1b;
      --dsw-alias-label-primary-dimmed: #3a3a3a;
      --dsw-alias-label-secondary: #5c5c5c;
      --dsw-alias-label-tertiary: #8b8b8b;
      --dsw-specific-tip: #f4f5f7;
      --dsw-alias-bg-base: #ffffff;
      --dsw-alias-border-l1: rgba(17, 17, 17, .08);
      --dsw-alias-border-l2: rgba(17, 17, 17, .12);
      --dsw-alias-interactive-bg-hover: rgba(17, 17, 17, .05);
      --dsw-alias-state-business-primary: #3b5bdb;
      --dsw-alias-state-error-primary: #d14343;
      --dsw-font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --dsw-font-xs-13: 13px/20px Inter, "Segoe UI", "PingFang SC", sans-serif;
      --dsh-composer-side-clearance: 0px;
      --dsh-composer-dock-inset: 0px;
      --dsh-composer-stack-gap: 0px;
      --dsh-composer-card-max-width: 720px;
    }
    html, body {
      margin: 0;
      background: #e8eaee;
      font-family: var(--dsw-font-family);
    }
    .stage {
      box-sizing: border-box;
      width: 720px;
      min-height: 420px;
      padding: 36px 40px 28px;
      background:
        radial-gradient(1200px 280px at 50% -80px, #ffffff 0%, #e8eaee 70%);
    }
    .caption {
      margin: 0 0 14px;
      color: #6b6b6b;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .shell {
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(17, 17, 17, .08);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(17, 17, 17, .06);
    }
    .dsh-queue-plus-dock {
      width: 100% !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .composer {
      display: flex;
      align-items: center;
      min-height: 56px;
      padding: 10px 14px;
      color: #8b8b8b;
      font-size: 13px;
      background: #fff;
      border-top: 1px solid rgba(17, 17, 17, .08);
    }
    .composer-pill {
      margin-left: auto;
      padding: 4px 10px;
      color: #3b5bdb;
      font-size: 12px;
      font-weight: 600;
      background: #eef1ff;
      border-radius: 999px;
    }
    .pointer {
      position: fixed;
      z-index: 20;
      width: 18px;
      height: 18px;
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.25));
      transform: translate(-2px, -2px);
    }
    .hidden { display: none !important; }
    .icon { width: 14px; height: 14px; display: block; }
    .icon-btn svg { display: block; }
    .dsh-queue-plus-lead svg { color: currentColor; }
    body:not([data-scene="clear"]):not([data-scene="undo"]) .dsh-queue-plus-undo {
      display: none !important;
    }
    body[data-scene="clear"] .dsh-queue-plus-body,
    body[data-scene="clear"] .dsh-queue-plus-header {
      display: none !important;
    }
    body[data-scene="clear"] .dsh-queue-plus-undo,
    body[data-scene="undo"] .dsh-queue-plus-undo {
      display: flex !important;
    }
    body[data-scene="restored"] .notice { display: block; }
    .notice {
      display: none;
      padding: 5px 12px 8px;
      color: #5c5c5c;
      font-size: 11px;
      line-height: 16px;
      border-top: 1px solid rgba(17, 17, 17, .08);
    }
    .dsh-queue-plus-row[data-ghost="true"] { opacity: .48; }
    .dsh-queue-plus-row[data-over="true"] {
      background: rgba(17, 17, 17, .05);
      box-shadow: inset 3px 0 0 #3b5bdb;
    }
    .dsh-queue-plus-mode-button[data-hot="true"],
    .dsh-queue-plus-clear-button[data-hot="true"],
    .dsh-queue-plus-undo-button[data-hot="true"] {
      background: rgba(17, 17, 17, .05);
    }
  </style>
  <style id="plugin">
    /* real plugin CSS follows */
  </style>
</head>
<body data-scene="manage">
<svg class="pointer hidden" id="pointer" viewBox="0 0 24 24" fill="none">
  <path d="M4 3.5 20 12.2l-7.1 1.4 2.6 6.9-3.1 1.2-2.6-6.9L4 20.2V3.5Z" fill="#111" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
<div class="stage">
  <p class="caption" id="caption">排队消息</p>
  <div class="shell">
    <div class="dsh-queue-plus-dock">
      <section class="dsh-queue-plus-panel" id="panel" aria-label="排队消息">
        <header class="dsh-queue-plus-header">
          <button type="button" class="dsh-queue-plus-summary-button">
            <span class="dsh-queue-plus-lead" aria-hidden="true">
              <svg class="icon" viewBox="0 0 14 14" fill="none"><path d="M2.5 3.5h9M2.5 7h9M2.5 10.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </span>
            <span class="dsh-queue-plus-count" id="count">3 条排队消息</span>
            <span class="dsh-queue-plus-sorting-label hidden" id="sortingLabel">排序中</span>
          </button>
          <button type="button" class="dsh-queue-plus-mode-button" id="modeBtn">排序</button>
          <button type="button" class="dsh-queue-plus-collapse-button" id="collapseBtn">
            <svg class="icon" viewBox="0 0 14 14" fill="none"><path d="M3 5.2 7 9l4-3.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </header>
        <div class="dsh-queue-plus-body" id="body">
          <ol class="dsh-queue-plus-list" id="list"></ol>
          <footer class="dsh-queue-plus-footer">
            <span class="dsh-queue-plus-footnote" id="footnote">清空后 10 秒内可撤销</span>
            <button type="button" class="dsh-queue-plus-clear-button" id="clearBtn">清空全部</button>
          </footer>
        </div>
        <div class="dsh-queue-plus-undo" id="undo">
          <span class="dsh-queue-plus-undo-text">已清空 3 条排队消息</span>
          <button type="button" class="dsh-queue-plus-undo-button" id="undoBtn">撤销（10s）</button>
        </div>
        <div class="notice" id="notice">已恢复 3 条排队消息</div>
      </section>
    </div>
    <div class="composer">
      继续输入下一条…
      <span class="composer-pill">排队发送</span>
    </div>
  </div>
</div>
<script>
  const STYLE_TEXT = String.raw`
PLACEHOLDER_STYLE
  `.trim();
  document.getElementById('plugin').textContent = STYLE_TEXT;

  const ITEMS = [
    ['a', '检查登录态和余额接口'],
    ['b', '给 README 补安装说明'],
    ['c', '写一封周报草稿'],
  ];

  function icons() {
    return `
      <button class="dsh-queue-plus-icon-button" tabindex="-1"><svg class="icon" viewBox="0 0 16 16" fill="none"><path d="M3.5 12.5 12 4M12 4H6.2M12 4v5.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button class="dsh-queue-plus-icon-button" tabindex="-1"><svg class="icon" viewBox="0 0 16 16" fill="none"><path d="M4 5h8l-.7 8.2a1 1 0 0 1-1 .8H5.7a1 1 0 0 1-1-.8L4 5Zm2-1.5h4l.3 1.5H5.7L6 3.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <button class="dsh-queue-plus-icon-button" tabindex="-1"><svg class="icon" viewBox="0 0 14 14" fill="none"><path d="M2.5 7h7.2M7.2 4.2 10.5 7 7.2 9.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    `;
  }

  function render(order, mode, opts = {}) {
    const list = document.getElementById('list');
    list.innerHTML = '';
    order.forEach((id, index) => {
      const text = ITEMS.find(item => item[0] === id)[1];
      const li = document.createElement('li');
      li.className = 'dsh-queue-plus-row';
      li.dataset.mode = mode;
      if (opts.ghost === id) li.dataset.ghost = 'true';
      if (opts.over === id) li.dataset.over = 'true';
      if (mode === 'sort') {
        li.innerHTML = `
          <span class="dsh-queue-plus-index">${String(index + 1).padStart(2, '0')}</span>
          <span class="dsh-queue-plus-drag-handle"><span class="dsh-queue-plus-grip-dots"></span></span>
          <span class="dsh-queue-plus-preview">${text}</span>
          <span class="dsh-queue-plus-actions">
            <button class="dsh-queue-plus-icon-button"><svg class="icon" viewBox="0 0 14 14" fill="none"><path d="M3.5 8.8 7 5.2l3.5 3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button class="dsh-queue-plus-icon-button"><svg class="icon" viewBox="0 0 14 14" fill="none"><path d="M3.5 5.2 7 8.8l3.5-3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </span>`;
      } else {
        li.innerHTML = `
          <span class="dsh-queue-plus-preview">${text}</span>
          <span class="dsh-queue-plus-actions">${icons()}</span>`;
      }
      list.appendChild(li);
    });
  }

  const scenes = {
    manage() {
      document.body.dataset.scene = 'manage';
      document.getElementById('panel').removeAttribute('data-sorting');
      document.getElementById('body').removeAttribute('data-sorting');
      document.getElementById('modeBtn').textContent = '排序';
      document.getElementById('modeBtn').removeAttribute('data-active');
      document.getElementById('modeBtn').removeAttribute('data-hot');
      document.getElementById('sortingLabel').classList.add('hidden');
      document.getElementById('collapseBtn').classList.remove('hidden');
      document.getElementById('footnote').textContent = '清空后 10 秒内可撤销';
      document.getElementById('clearBtn').removeAttribute('data-hot');
      document.getElementById('caption').textContent = '3 条排队消息';
      render(['a', 'b', 'c'], 'manage');
    },
    sortHover() {
      scenes.manage();
      document.getElementById('modeBtn').dataset.hot = 'true';
      document.getElementById('caption').textContent = '点「排序」';
    },
    sorting() {
      document.body.dataset.scene = 'sorting';
      document.getElementById('panel').dataset.sorting = 'true';
      document.getElementById('body').dataset.sorting = 'true';
      document.getElementById('modeBtn').textContent = '完成';
      document.getElementById('modeBtn').dataset.active = 'true';
      document.getElementById('modeBtn').removeAttribute('data-hot');
      document.getElementById('sortingLabel').classList.remove('hidden');
      document.getElementById('collapseBtn').classList.add('hidden');
      document.getElementById('footnote').textContent = '拖动手柄，或使用上下箭头';
      document.getElementById('caption').textContent = '按执行顺序排列';
      render(['a', 'b', 'c'], 'sort');
    },
    dragging() {
      scenes.sorting();
      document.getElementById('caption').textContent = '拖动调整顺序';
      render(['a', 'b', 'c'], 'sort', { ghost: 'c', over: 'a' });
    },
    moved() {
      scenes.sorting();
      document.getElementById('caption').textContent = '周报已排到最前';
      render(['c', 'a', 'b'], 'sort');
    },
    managedNew() {
      scenes.manage();
      render(['c', 'a', 'b'], 'manage');
      document.getElementById('caption').textContent = '新顺序已生效';
    },
    clearHover() {
      scenes.managedNew();
      document.getElementById('clearBtn').dataset.hot = 'true';
      document.getElementById('caption').textContent = '一键清空';
    },
    clear(seconds = 10) {
      document.body.dataset.scene = 'clear';
      document.getElementById('undoBtn').textContent = `撤销（${seconds}s）`;
      document.getElementById('undoBtn').removeAttribute('data-hot');
      document.getElementById('caption').textContent = '10 秒内可撤销';
    },
    undoHover() {
      scenes.clear(8);
      document.getElementById('undoBtn').dataset.hot = 'true';
      document.getElementById('caption').textContent = '撤销清空';
    },
    restored() {
      document.body.dataset.scene = 'restored';
      document.getElementById('panel').removeAttribute('data-sorting');
      document.getElementById('body').removeAttribute('data-sorting');
      document.getElementById('modeBtn').textContent = '排序';
      document.getElementById('modeBtn').removeAttribute('data-active');
      document.getElementById('sortingLabel').classList.add('hidden');
      document.getElementById('collapseBtn').classList.remove('hidden');
      document.getElementById('footnote').textContent = '清空后 10 秒内可撤销';
      document.getElementById('clearBtn').removeAttribute('data-hot');
      document.getElementById('caption').textContent = '已恢复 3 条排队消息';
      render(['c', 'a', 'b'], 'manage');
    },
  };

  window.setScene = (name, arg) => scenes[name](arg);
  window.placePointer = (x, y, visible = true) => {
    const el = document.getElementById('pointer');
    el.classList.toggle('hidden', !visible);
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
  };
  window.targetCenter = (selector) => {
    const el = document.querySelector(selector);
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };
  scenes.manage();
</script>
</body>
</html>
